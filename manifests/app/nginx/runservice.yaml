apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  name: nginx
  namespace: default
spec:
  ingress: "INGRESS_TRAFFIC_ALL"
  launchStage: "GA"
  location: "asia-northeast1-a"
  projectRef:
    external: "playground-502010"
  template:
    containers:
      - image: "nginx:1.14.2"
        ports:
          - containerPort: 80
    scaling:
      maxInstanceCount: 2
  traffic:
    - percent: 100
      type: "TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
spec:
  destination:
    namespace: main
    server: https://kubernetes.default.svc
  project: default
  source:
    path: manifests/app/nginx
    repoURL: https://github.com/takahiroaoki/gcp-playground.git
    targetRevision: main
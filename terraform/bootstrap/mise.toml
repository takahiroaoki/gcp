[tasks.enable]
run = "gcloud services enable container.googleapis.com run.googleapis.com"

#################
### terraform ###
#################

[tasks.tfinit]
run = "terraform init"

[tasks.tffmt]
run = "terraform fmt"

[tasks.tfvalidate]
run = "terraform validate"

[tasks.tfplan]
run = "terraform plan"

[tasks.tfapply]
run = "terraform apply"

[tasks.tfdestroy]
run = "terraform destroy"
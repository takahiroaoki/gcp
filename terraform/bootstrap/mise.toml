#################
### terraform ###
#################

[tasks.tfinit]
run = "terraform init"

[tasks.tffmt]
run = "terraform fmt"

[tasks.tfvalidate]
run = "terraform validate"

[tasks.tfplan]
run = "terraform plan"

[tasks.tfapply]
run = "terraform apply"

[tasks.tfdestroy]
run = "terraform destroy"

###########
### GKE ###
###########
[tasks.argocdnamespace]
run = "kubectl create namespace argocd"

[tasks.argocdapply]
run = "kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml"

[tasks.argocdexpose]
run = "kubectl patch svc argocd-server -n argocd -p '{\"spec\": {\"type\": \"LoadBalancer\"}}'"

[tasks.argocd]
run = [
	{ task = "gkecred"},
	{ task = "argocdnamespace"},
	{ task = "argocdapply"},
	{ task = "argocdexpose"},
]

[tasks.argocdpwd]
run = "argocd admin initial-password -n argocd"